<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M1 · Edit team guidance</title><style>body{margin:0;background:#f5f5f3;color:#222;font:15px system-ui}main{max-width:1080px;margin:35px auto;padding:24px}h1{font-size:34px}a{color:inherit}button,input,select,textarea{font:inherit;border:1px solid #ccc;border-radius:5px;padding:11px}button{cursor:pointer;background:white}button.primary{background:#111;color:white}input,select,textarea{width:100%;box-sizing:border-box}textarea{min-height:230px;line-height:1.6}label{display:block;margin:18px 0 6px;color:#555}.layout{display:grid;grid-template-columns:250px 1fr;gap:25px}.card{background:white;padding:25px;border:1px solid #ddd;border-radius:9px}.row{display:flex;gap:12px}.row>div{flex:1}#sections button{display:block;width:100%;margin-bottom:8px;text-align:left}#sections button[aria-current=true]{border-color:#111;font-weight:700}.link-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin:8px 0}#status{padding:14px 0;color:#555;min-height:20px}small{color:#777}.actions{display:flex;justify-content:space-between;margin-top:20px;gap:12px}@media(max-width:720px){.layout{grid-template-columns:1fr}.row{display:block}.link-row{grid-template-columns:1fr}}</style></head><body><main><a href="/admin">← Owner controls</a><h1>Team duties & project guidance</h1><p>Edit the text, responsibilities and links below. Save publishes your changes to the existing M1 dashboard.</p><div id="status" role="status">Loading…</div><div class="layout"><aside><div id="sections"></div><button id="add">＋ Add section</button></aside><section class="card"><label for="area">Section</label><select id="area"><option value="duties">Team duties</option><option value="guidance">Knowledge hub guidance</option></select><label for="title">Title</label><input id="title" maxlength="150"><div class="row"><div><label for="frequency">When / frequency</label><input id="frequency" maxlength="100" placeholder="Weekly, before submission…"></div><div><label for="responsible">Responsible team / role</label><input id="responsible" maxlength="200"></div></div><label for="body">Instructions</label><textarea id="body" maxlength="18000" placeholder="Write the actual M1 process in plain language…"></textarea><label>Folder and reference links</label><div id="links"></div><button id="add-link">＋ Add link</button><div class="actions"><button id="remove">Remove section</button><button id="save" class="primary">Save & publish changes</button></div><small>No coding required. Instructions are saved as plain text.</small></section></div></main><script>
const $=id=>document.getElementById(id);let data=null,index=0,dirty=false;
function message(s){$('status').textContent=s;}
function readForm(){if(!data?.sections[index])return;const s=data.sections[index];for(const k of ['area','title','frequency','responsible','body'])s[k]=$(k).value;s.links=[...$('links').children].map(row=>({label:row.querySelector('[data-label]').value,url:row.querySelector('[data-url]').value})).filter(l=>l.label||l.url);}
function linkRow(link={label:'',url:''}){const row=document.createElement('div');row.className='link-row';const label=document.createElement('input');label.dataset.label='';label.placeholder='Link label';label.value=link.label;label.setAttribute('aria-label','Link label');const url=document.createElement('input');url.dataset.url='';url.type='url';url.placeholder='https://…';url.value=link.url;url.setAttribute('aria-label','Link address');const remove=document.createElement('button');remove.textContent='×';remove.setAttribute('aria-label','Remove link');remove.onclick=()=>{row.remove();dirty=true;};row.append(label,url,remove);$('links').append(row);}
function render(){const s=data.sections[index];$('sections').replaceChildren();data.sections.forEach((section,i)=>{const b=document.createElement('button');b.textContent=section.title||'Untitled section';b.setAttribute('aria-current',String(i===index));b.onclick=()=>{readForm();index=i;render();};$('sections').append(b);});for(const k of ['area','title','frequency','responsible','body'])$(k).value=s?.[k]||'';$('links').replaceChildren();for(const l of s?.links||[])linkRow(l);}
document.querySelector('.card').addEventListener('input',()=>{dirty=true;});$('add-link').onclick=()=>{linkRow();dirty=true;};$('add').onclick=()=>{readForm();if(data.sections.length>=40)return message('Use up to 40 sections.');data.sections.push({id:'section-'+crypto.randomUUID(),area:'duties',title:'New section',frequency:'',responsible:'',body:'',links:[]});index=data.sections.length-1;dirty=true;render();};$('remove').onclick=()=>{if(data.sections.length<2)return message('Keep at least one section.');data.sections.splice(index,1);index=Math.max(0,index-1);dirty=true;render();};
$('save').onclick=async()=>{readForm();$('save').disabled=true;message('Saving…');try{const response=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),result=await response.json();if(!response.ok)throw Error(result.error||'Unable to save.');data=result;dirty=false;render();message('Published. Your team will see these changes on the M1 dashboard.');}catch(e){message(e.message);}finally{$('save').disabled=false;}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
fetch('/api/content',{cache:'no-store'}).then(r=>r.json()).then(d=>{data=d;render();message('Ready to edit.');}).catch(()=>message('Unable to load the guidance. Reload this page.'));
</script></body></html>
