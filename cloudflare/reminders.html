<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M1 · Weekly reminders</title><style>body{font:15px system-ui;background:#f4f4f1;color:#222}main{max-width:750px;margin:40px auto;background:white;padding:32px;border-radius:14px}a{color:inherit}h1{font-size:32px}label{display:block;margin-top:20px;font-weight:600}input,textarea,button{font:inherit;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:5px}input,textarea{width:100%;margin-top:7px}textarea{min-height:120px}button{margin:15px 10px 0 0;cursor:pointer;background:#181818;color:white}button:disabled{opacity:.45;cursor:not-allowed}p{line-height:1.6;color:#666}.status{background:#f3f1e6;padding:15px;border-radius:8px}</style></head><body><main><a href="/admin">← Owner controls</a><h1>Weekly sharing reminders</h1><p>Every Wednesday at 2:00 PM Dubai time. The email includes a link to M1 Duties.</p><div id="status" class="status" role="status">Loading…</div><form id="form"><label>Sender email<input type="email" id="sender" placeholder="Approved project mailbox"></label><label>Recipients — one email per line<textarea id="recipients"></textarea></label><label>Subject<input id="subject" maxlength="200" required></label><label>Message<textarea id="message" maxlength="4000" required></textarea></label><p>The Duties link is included automatically when sending is connected. Saving this form does not send an email.</p><button>Save settings</button><button id="pause" type="button">Pause reminders</button><button id="resume" type="button" disabled>Resume reminders</button></form></main><script>
let settings;const $=id=>document.getElementById(id);async function call(method,body){const r=await fetch('/api/admin/reminders',{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to save.');return d;}function render(){for(const k of ['sender','subject','message'])$(k).value=settings[k];$('recipients').value=settings.recipients.join('\n');$('resume').disabled=!settings.connected;$('pause').disabled=settings.paused;$('status').textContent=settings.connected?(settings.paused?'Reminders paused.':'Reminders active.'):'Reminders paused — sender connection and recipient approval are required before activation.';}async function save(paused=true){const body={...settings,paused,sender:$('sender').value.trim(),recipients:$('recipients').value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean),subject:$('subject').value,message:$('message').value};try{settings=await call('PUT',body);render();}catch(e){$('status').textContent=e.message;}}$('form').onsubmit=e=>{e.preventDefault();save(settings.paused);};$('pause').onclick=()=>save(true);$('resume').onclick=()=>save(false);call('GET').then(d=>{settings=d;render();}).catch(e=>$('status').textContent=e.message);
</script></body></html>
