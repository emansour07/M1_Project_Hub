<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M1 · Team operations</title><style>
*{box-sizing:border-box}body{margin:0;color:#181818;background:#f3f3f0;font:15px/1.6 system-ui}header{background:#101010;color:white;padding:20px 5%;display:flex;justify-content:space-between}header a{color:white}main{max-width:1120px;margin:36px auto;padding:0 24px}h1{font-size:38px;letter-spacing:-1px;line-height:1.1}h2{font-size:23px}section{background:white;padding:28px;margin:22px 0;border:1px solid #ddd;border-radius:10px}label{display:block;margin:15px 0;font-size:13px;font-weight:650}input,select,textarea{display:block;width:100%;font:inherit;border:1px solid #bbb;padding:12px;margin-top:6px;background:white}input[type=checkbox]{display:inline;width:auto;margin-right:8px}button,.button{border:1px solid #171717;background:#171717;color:white;padding:12px 18px;cursor:pointer;display:inline-block;text-decoration:none;font:inherit;border-radius:4px;margin:4px}button:disabled{opacity:.45;cursor:wait}.secondary{background:white;color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.quiet,small{color:#666}small{display:block}.message{padding:16px;background:#fff2d6;border-left:3px solid #a77b2b;white-space:pre-wrap}.record{border-top:1px solid #ddd;padding:20px 0}.pill{display:inline-block;background:#edf2f6;border-radius:20px;padding:3px 12px}.destination{overflow-wrap:anywhere}.preview{border-left:4px solid #26715b;background:#eef7f2;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}progress{width:100%;height:22px}.offscreen{position:absolute;left:-9999px}[hidden]{display:none!important}details{margin:12px 0}summary{cursor:pointer;font-weight:650}.scroll{max-height:480px;overflow:auto}@media(max-width:650px){.grid{grid-template-columns:1fr}section{padding:18px}h1{font-size:30px}}
</style><header><b>ARX / M1</b><a href="/">Project dashboard ↗</a></header><main><p class="quiet">M1 / TEAM OPERATIONS</p><h1 id="title">Loading…</h1><p id="message" class="message" role="status" hidden></p><div id="view"></div></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),message=s=>{$('message').textContent=s;$('message').hidden=!s;},option=(v,t)=>'<option value="'+esc(v)+'">'+esc(t)+'</option>';
async function api(path,method='GET',data){const r=await fetch('/api/operations/'+path,{method,headers:data instanceof Blob?{}:data===undefined?{}:{'Content-Type':'application/json'},body:data===undefined?undefined:data instanceof Blob?data:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to complete this action.');return d;}
async function action(button,fn){button.disabled=true;try{await fn();}catch(e){message(e.message);}finally{button.disabled=false;}}
let adminData,sharingData,selectedFile,preview;
async function accessForm(){const d=await api('access');$('title').textContent='Request Forma access';$('view').innerHTML='<section><p>Request access to the M1 project workspace. The project owner will review your details and selected project role.</p>'+(!d.roles.length?'<p class="message">The project owner needs to refresh the M1 role list before requests can be submitted.</p>':'')+'<form id="request"><div class="grid"><label>Full name<input name="fullName" required maxlength="150" autocomplete="name"></label><label>Work email<input name="email" type="email" required maxlength="254" autocomplete="email"></label><label>Company<input name="company" required maxlength="150" autocomplete="organization"></label><label>Project<input value="M1" disabled></label><label>Project role<select name="roleId" required>'+option('','Select your M1 role')+d.roles.map(r=>option(r.id,r.name)).join('')+'</select></label><label>Discipline<select name="discipline" required>'+option('','Select discipline')+d.disciplines.map(r=>option(r,r)).join('')+'</select></label></div><label class="offscreen" aria-hidden="true">Leave blank<input name="website" tabindex="-1" autocomplete="off"></label><p class="quiet">Your details are visible to the project owner. Access follows the selected role’s existing M1 folder permissions. Requests do not grant administrator access.</p><button '+(!d.roles.length?'disabled':'')+'>Request access</button></form></section>';$('request').onsubmit=e=>{e.preventDefault();action(e.submitter,async()=>{const d=await api('access','POST',Object.fromEntries(new FormData(e.target)));message(d.message);e.target.reset();});};}
async function admin(){adminData=await api('admin');const d=adminData;$('title').textContent='Team operations';$('view').innerHTML='<p>'+esc(d.user.email)+'</p><section><div class="grid"><div><h2>Forma access requests</h2><p>Roles come from current M1 project members. Refresh when project roles change.</p><button id="roles">Refresh project roles</button><a class="button secondary" href="/access-request" target="_blank">Open request form ↗</a></div><div><p class="message">Approval inbox is active here. Email notifications to '+esc(d.notificationEmail)+' are pending the company mailbox connection.</p><p class="quiet">Approval adds M1 Docs member access with the requested role. Existing members’ permissions are preserved.</p></div></div><div id="requests">'+(d.requests.map(r=>'<article class="record"><h3>'+esc(r.fullName)+' <span class="pill">'+esc(r.state.replaceAll('_',' '))+'</span></h3><p>'+esc(r.email)+' · '+esc(r.company)+'<br>'+esc(r.roleName)+' · '+esc(r.discipline)+'</p><small>'+esc(new Date(r.createdAt).toLocaleString())+'</small>'+(r.detail?'<p>'+esc(r.detail)+'</p>':'')+(r.state==='pending'?'<label><input type="checkbox" id="confirm-'+r.id+'">I have reviewed this person and their selected M1 role.</label><button data-approve="'+r.id+'">Approve & add to M1</button><button class="secondary" data-reject="'+r.id+'">Reject request</button>':'')+'</article>').join('')||'<p>No access requests yet.</p>')+'</div></section><section><h2>Weekly sharing destinations</h2><p>Confirm which observed Shared folders editors may use. The filename must match the chosen asset and discipline. Editors only see their assigned scope.</p><div class="scroll">'+d.candidates.map(c=>'<label class="destination"><input type="checkbox" name="destination" value="'+esc(c.id)+'" '+(d.destinations.rows.some(r=>r.id===c.id)?'checked':'')+'>'+esc(c.scopeName)+' · '+esc(c.scopeId)+' · '+esc(c.discipline)+'<small>'+esc((c.source==='progress1'?'Shared 1':'Shared 2')+' / '+c.folderPath.join(' / '))+'</small></label>').join('')+'</div><button id="destinations">Save confirmed destinations</button><a class="button secondary" href="/sharing">Open model upload ↗</a><p class="quiet">Only folders found in the latest scoped model scan are offered. Empty or unclassified folders should be checked in ACC before adding their models.</p></section><section><h2>Organisation chart</h2><p>'+ (d.orgchart?'Published in the Knowledge hub.':'Awaiting publication.')+'</p><label>Prepared chart (.svg)<input id="chart" type="file" accept=".svg,image/svg+xml"></label><button id="publish-chart">Publish chart</button></section><section><h2>Recent model uploads</h2>'+ (d.uploads.slice(0,40).map(r=>'<article class="record"><strong>'+esc(r.name)+'</strong> <span class="pill">'+esc(r.state.replaceAll('_',' '))+'</span><small>'+esc(r.email)+' · '+esc(r.destination.scopeName)+' · '+esc(r.destination.discipline)+'</small><p>'+esc(r.detail||'')+'</p></article>').join('')||'<p>No model uploads yet.</p>')+'</section>';
 $('roles').onclick=e=>action(e.target,async()=>{const r=await api('roles','POST',{});await admin();message(r.roles.length+' current project roles loaded.');});
 $('destinations').onclick=e=>action(e.target,async()=>{await api('destinations','PUT',{revision:d.destinations.revision,ids:[...document.querySelectorAll('input[name=destination]:checked')].map(x=>x.value)});await admin();message('Confirmed destinations saved.');});
 $('publish-chart').onclick=e=>action(e.target,async()=>{const f=$('chart').files[0];if(!f||f.size>120000)throw Error('Select a prepared SVG chart up to 120 KB.');await api('orgchart','PUT',{svg:await f.text()});await admin();message('Organisation chart published to the Knowledge hub.');});
 for(const b of document.querySelectorAll('[data-approve],[data-reject]'))b.onclick=e=>action(b,async()=>{const approve=!!b.dataset.approve,id=b.dataset.approve||b.dataset.reject;if(approve&&!$('confirm-'+id).checked)throw Error('Review the details and tick the confirmation first.');const r=await api('decide','POST',{id,approve});await admin();message(r.detail||'Request rejected.');});
}
async function sharing(){sharingData=await api('sharing');const d=sharingData;$('title').textContent='Upload to your Shared folder';$('view').innerHTML='<section><p>'+esc(d.user.email)+'</p><p>Select the asset, discipline and confirmed destination. A preview checks the existing ACC file before upload.</p><div class="grid"><label>Asset<select id="asset">'+option('','Select asset')+[...new Map(d.destinations.map(x=>[x.scopeId,x.scopeName+' · '+x.scopeId]))].map(([id,label])=>option(id,label)).join('')+'</select></label><label>Discipline<select id="discipline">'+option('','Select discipline')+'</select></label></div><label>Confirmed Shared folder<select id="destination">'+option('','Select folder')+'</select></label><label>Model file<input id="file" type="file" accept=".rvt,.dwg,.nwc,.ifc,.dwfx"></label><p class="quiet">Up to 512 MB per file. Share native RVT / Civil 3D DWG and NWC with matching names. Upload each format separately.</p>'+(!d.destinations.length?'<p class="message">No confirmed destination is assigned to you yet. Ask the owner to confirm the asset / discipline folders.</p>':'')+'<button id="preview">Preview destination</button><div id="upload-preview"></div></section>';
 $('asset').onchange=()=>{$('discipline').innerHTML=option('','Select discipline')+[...new Set(d.destinations.filter(x=>x.scopeId===$('asset').value).map(x=>x.discipline))].map(x=>option(x,x)).join('');filterFolders();};$('discipline').onchange=filterFolders;function filterFolders(){$('destination').innerHTML=option('','Select folder')+d.destinations.filter(x=>x.scopeId===$('asset').value&&x.discipline===$('discipline').value).map(x=>option(x.id,(x.source==='progress1'?'Shared 1':'Shared 2')+' / '+x.folderPath.join(' / '))).join('');$('upload-preview').replaceChildren();preview=null;}
 $('file').onchange=()=>{$('upload-preview').replaceChildren();preview=null;};$('destination').onchange=()=>{$('upload-preview').replaceChildren();preview=null;};
 $('preview').onclick=e=>action(e.target,async()=>{selectedFile=$('file').files[0];if(!selectedFile)throw Error('Select a model file first.');preview=await api('preview','POST',{destination:$('destination').value,name:selectedFile.name,size:selectedFile.size});const p=preview;$('upload-preview').innerHTML='<div class="preview"><h2>Confirm upload</h2><p><strong>'+esc(p.name)+'</strong><br>'+esc(p.destination.scopeName)+' · '+esc(p.destination.discipline)+'<br>'+esc(p.destination.folderPath.join(' / '))+'</p><p>'+(p.newVersion?'Create a new version of the existing ACC file.':'Create a new ACC file.')+'</p>'+(p.naming.issues?.length?'<p class="message">Naming check: '+esc(p.naming.issues.map(x=>x.message).join(' '))+(p.naming.suggestion?'<br>Suggested: '+esc(p.naming.suggestion):'')+'</p>':'')+'<label><input id="confirm-upload" type="checkbox">I confirm this destination and '+(p.newVersion?'creation of a new version.':'creation of this file.')+'</label><button id="upload">Confirm & upload</button><progress id="progress" value="0" max="100"></progress><p id="upload-status" role="status"></p></div>';$('upload').onclick=e=>action(e.target,upload);});}
async function upload(){if(!$('confirm-upload').checked)throw Error('Confirm the preview first.');const p=preview,f=selectedFile;if(!p||!f||f.name!==p.name||f.size!==p.size)throw Error('The selection changed. Preview again.');for(const id of ['asset','discipline','destination','file','preview'])$(id).disabled=true;let started=false;try{const base='upload/'+p.id;await api(base+'/start','POST',{confirm:true,confirmVersion:p.newVersion});started=true;for(let off=0,part=1;off<f.size;off+=sharingData.chunkSize,part++){await api(base+'/part?part='+part,'POST',f.slice(off,Math.min(f.size,off+sharingData.chunkSize)));const percent=Math.round(Math.min(f.size,off+sharingData.chunkSize)/f.size*100);$('progress').value=percent;$('upload-status').textContent='Transferred '+percent+'%';}const result=await api(base+'/finish','POST',{});$('upload-status').textContent=result.message;message(result.message);$('upload').hidden=true;}catch(e){if(started){$('upload').hidden=true;$('upload-status').textContent='Transfer stopped. Check the owner upload history and ACC before starting a fresh preview.';}throw e;}finally{for(const id of ['asset','discipline','destination','file','preview'])$(id).disabled=false;}}

let planData,plan;
async function masterplans(){planData=await api('masterplans');$('title').textContent='Edit interactive masterplans';$('view').innerHTML='<section><p>Upload the approved plan, select an in-scope asset, then click its actual location. Use the highlighted Revit-derived building positions where the sources differ. Locations and functions are entered explicitly; phase and completeness come from the MIDP.</p><button id="sync-locations" type="button" class="secondary">Refresh coordinates & levels from ACC</button><label>Area<select id="plan-zone">'+planData.plans.map(p=>option(p.zone,p.zone)).join('')+'</select></label><details><summary>Browse supplied ACC masterplan source</summary><button id="plan-root" type="button" class="secondary">Open source folder</button><div id="plan-source-files"></div></details><div id="plan-editor"></div></section>';$('sync-locations').onclick=e=>action(e.target,async()=>{const d=await api('locations','POST',{});message(d.rows.length+' in-scope location records refreshed. Original values retained; units unconfirmed.');});$('plan-zone').onchange=()=>editPlan();$('plan-root').onclick=e=>action(e.target,()=>browsePlanSource());editPlan();}
async function browsePlanSource(folder=''){const d=await api('plan-source?folder='+encodeURIComponent(folder));$('plan-source-files').innerHTML='<p class="quiet">'+esc(d.folder)+'</p>'+d.rows.map(r=>r.type==='folders'?'<button type="button" class="secondary" data-source-folder="'+esc(r.id)+'">'+esc(r.name)+' →</button>':/\.(pdf|png|jpe?g)$/i.test(r.name)?'<a class="button secondary" href="/api/operations/plan-source-file?folder='+encodeURIComponent(d.folder)+'&amp;item='+encodeURIComponent(r.id)+'">Download '+esc(r.name)+'</a>':'<p>'+esc(r.name)+'</p>').join('');for(const b of document.querySelectorAll('[data-source-folder]'))b.onclick=()=>action(b,()=>browsePlanSource(b.dataset.sourceFolder));}
function editPlan(){plan=structuredClone(planData.plans.find(p=>p.zone===$('plan-zone').value));$('plan-editor').innerHTML='<label>Plan title<input id="plan-title" maxlength="160" value="'+esc(plan.title)+'"></label><label>Approved source link<input id="plan-source" type="url" value="'+esc(plan.sourceUrl)+'" placeholder="https://acc.autodesk.eu/…"></label><label>Plan image — PNG / JPG, up to 1 MB<input id="plan-file" type="file" accept="image/png,image/jpeg"></label><div class="grid"><label>Asset to place<select id="plan-asset">'+option('','Select asset')+planData.assets.filter(a=>a.zone===plan.zone&&!a.code.startsWith('EW-')).map(a=>option(a.id,(a.proposed||a.code)+' · '+a.name+' · '+a.id)).join('')+'</select></label><label>Asset function<textarea id="plan-function" maxlength="1000" placeholder="Enter the confirmed function"></textarea></label></div><p class="quiet">Select an asset, enter its function and click the image. Select a placed asset to move it. Area-wide external works are presented separately from building pins.</p><details><summary>Precise tag placement</summary><div class="grid"><label>Horizontal position (%)<input id="pin-x" type="number" min="0" max="100" step="0.01"></label><label>Vertical position (%)<input id="pin-y" type="number" min="0" max="100" step="0.01"></label><label>Building width (%)<input id="pin-width" type="number" min="0.1" max="100" step="0.01" value="5"></label><label>Building height (%)<input id="pin-height" type="number" min="0.1" max="100" step="0.01" value="4"></label></div><button id="place-pin" type="button" class="secondary">Apply tag position</button></details><div id="plan-canvas" style="position:relative;display:block"></div><div id="plan-pins"></div><button id="save-plan">Save & publish plan</button>';
 $('plan-file').onchange=async()=>{try{const f=$('plan-file').files[0];if(!f||f.size>1024*1024||!['image/png','image/jpeg'].includes(f.type))throw Error('Choose a PNG or JPG up to 1 MB.');plan.image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Image could not be read.'));reader.readAsDataURL(f);});drawPlan();}catch(e){message(e.message);}};
 $('plan-asset').onchange=()=>{const a=plan.assets.find(a=>a.id===$('plan-asset').value);$('plan-function').value=a?.function||'';for(const k of ['x','y','width','height'])$('pin-'+k).value=a?.[k]??(k==='width'?5:k==='height'?4:'');};$('plan-function').oninput=()=>{const a=plan.assets.find(a=>a.id===$('plan-asset').value);if(a)a.function=$('plan-function').value;};
 $('place-pin').onclick=()=>{const id=$('plan-asset').value,x=Number($('pin-x').value),y=Number($('pin-y').value);if(!id||!$('pin-x').value||!$('pin-y').value||!Number.isFinite(x)||!Number.isFinite(y)||x<0||x>100||y<0||y>100){message('Choose an asset and positions between 0 and 100.');return;}plan.assets=plan.assets.filter(a=>a.id!==id);plan.assets.push({id,x,y,width:Number($('pin-width').value),height:Number($('pin-height').value),function:$('plan-function').value});drawPlan();};
 $('save-plan').onclick=e=>action(e.target,async()=>{const r=await api('masterplans','PUT',{...plan,title:$('plan-title').value,sourceUrl:$('plan-source').value});plan.revision=r.revision;const zone=plan.zone;await masterplans();$('plan-zone').value=zone;editPlan();message('Masterplan and asset locations published.');});drawPlan();}
function drawPlan(){const canvas=$('plan-canvas');canvas.replaceChildren();if(plan.image){const img=document.createElement('img');img.src=plan.image;img.alt=plan.title;img.style.cssText='width:100%;display:block;cursor:crosshair';canvas.append(img);img.onclick=e=>{const id=$('plan-asset').value;if(!id){message('Select an asset before placing it.');return;}const rect=img.getBoundingClientRect(),pin={id,x:Math.round((e.clientX-rect.left)/rect.width*10000)/100,y:Math.round((e.clientY-rect.top)/rect.height*10000)/100,width:Number($('pin-width').value),height:Number($('pin-height').value),function:$('plan-function').value};plan.assets=plan.assets.filter(a=>a.id!==id);plan.assets.push(pin);drawPlan();};for(const pin of plan.assets){const a=planData.assets.find(a=>a.id===pin.id);if(!a)continue;const tag=document.createElement('button');tag.type='button';tag.textContent=a.proposed||a.code;tag.title=a.name;tag.style.cssText='position:absolute;transform:translate(-50%,-50%);padding:3px 7px;margin:0;background:#fff;color:#111;font-size:11px;left:'+pin.x+'%;top:'+pin.y+'%';tag.onclick=()=>{$('plan-asset').value=pin.id;$('plan-function').value=pin.function;};canvas.append(tag);}}else canvas.textContent='Plan image not supplied yet.';
 $('plan-pins').innerHTML=plan.assets.map(p=>{const a=planData.assets.find(a=>a.id===p.id);return '<p>'+esc(a?.name||p.id)+' · '+esc(a?.proposed||a?.code||p.id)+' <button type="button" class="secondary" data-remove-pin="'+esc(p.id)+'">Remove location</button></p>';}).join('');for(const b of document.querySelectorAll('[data-remove-pin]'))b.onclick=()=>{plan.assets=plan.assets.filter(a=>a.id!==b.dataset.removePin);drawPlan();};}
const path=location.pathname;(path==='/admin/masterplans'?masterplans:path==='/admin/operations'?admin:path==='/sharing'?sharing:accessForm)().catch(e=>{message(e.message);if(path!=='/access-request'){$('title').textContent='Sign in to continue';$('view').innerHTML='<section><p>Approved internal editors use Autodesk. The owner can use the existing owner code.</p><a class="button" href="/auth/editor/login?next=sharing">Sign in with Autodesk</a><a class="button secondary" href="/admin/login">Owner sign-in</a></section>';}});
</script></html>
