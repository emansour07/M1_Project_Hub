name: Publish M1 interim dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_legacy:
        description: Publish the interim Cloudflare-connected frontend
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: m1-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push' || inputs.publish_legacy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.mjs
      - run: node build.cjs --release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
