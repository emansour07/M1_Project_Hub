<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M1 · Original design analysis</title><style>body{font:16px/1.6 system-ui;background:#f5f5f2;color:#171717;margin:0}main{max-width:760px;margin:60px auto;padding:28px;background:white;border:1px solid #ddd;border-radius:12px}button{padding:12px 20px;background:#111;color:white;border:0;border-radius:5px;font:inherit;cursor:pointer}input{display:block;margin:25px 0}p{white-space:pre-wrap}a{color:inherit}</style><main><p>ARX / M1 · OWNER</p><h1>Update original design analysis</h1><p>Publish the prepared read-only extraction of M1_Models_Received.xlsx. Only confirmed scoped assets are retained. This does not modify the source Excel workbook or upload model files.</p><input id="file" type="file" accept=".json" aria-label="Prepared analysis file"><button id="save" disabled>Publish analysis</button><p id="message" role="status"></p><a href="/">Return to dashboard ↗</a></main><script>
const file=document.getElementById('file'),save=document.getElementById('save'),message=document.getElementById('message');let data;
file.onchange=async()=>{save.disabled=true;try{if(file.files[0].size>1500000)throw Error('The file is too large.');data=JSON.parse(await file.files[0].text());if(!Array.isArray(data.rows))throw Error('Select the prepared analysis.');message.textContent=data.rows.length+' entries prepared. Scope will be checked again before publishing.';save.disabled=false;}catch(e){message.textContent=e.message;}};
save.onclick=async()=>{save.disabled=true;try{const csrf=document.cookie.split('; ').find(c=>c.startsWith('csrftoken='))?.slice(10),r=await fetch('/api/received/import',{method:'PUT',headers:{'Content-Type':'application/json',...(csrf?{'X-CSRFToken':decodeURIComponent(csrf)}:{})},body:JSON.stringify(data)}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to publish.');message.textContent='Published '+d.count+' scoped model entries. The source Excel file was not changed.';}catch(e){message.textContent=e.message;}finally{save.disabled=false;}};
</script></html>
